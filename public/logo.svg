<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- 'g' Gradient -->
    <linearGradient id="g-grad" x1="16" y1="24" x2="52" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- 'n' Gradient -->
    <linearGradient id="n-grad" x1="48" y1="24" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ping Pulse Glow -->
    <linearGradient id="ping-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Rect -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg-grad)" stroke="#27272a" stroke-width="2" />

  <!-- Inner Subtle Accent Glow -->
  <circle cx="50" cy="50" r="32" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- The Monogram 'g + n' -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 'g' Bowl: loop on the left -->
    <path
      d="M 48 38 C 48 29.16 40.84 22 32 22 C 23.16 22 16 29.16 16 38 C 16 46.84 23.16 54 32 54 C 40.84 54 48 46.84 48 38 Z"
      stroke="url(#g-grad)"
      stroke-width="8.5"
    />

    <!-- 'g' Stem & Descender: sweeps down from right of bowl and hooks under to left -->
    <path
      d="M 48 38 L 48 66 C 48 74 41 79 32 79 C 23 79 18 74 18 70"
      stroke="url(#g-grad)"
      stroke-width="8.5"
    />

    <!-- 'n' Arch & Leg: emerges from center stem, curves over to right, and grounds down -->
    <path
      d="M 48 44 C 48 32 56 22 68 22 C 77 22 84 29 84 38 L 84 74"
      stroke="url(#n-grad)"
      stroke-width="8.5"
    />

    <!-- Notification Pulse Dot: Ping accent over top-right of 'n' -->
    <circle cx="84" cy="18" r="4.5" fill="url(#ping-grad)" filter="url(#glow)" />
    <!-- Notification Signal Wave -->
    <path
      d="M 75 12 C 78 9 84 8 89 10"
      stroke="#38bdf8"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
